services:
  todo:
    build: .
    image: todo-mcp
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # SQLite paths are relative to prisma/, so this lands in /app/data.
      DATABASE_URL: "file:../data/todo.db"
      NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:-http://localhost:3000}"
      # Generate with `npm run gen:vapid` and put them in a .env next to this file.
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: "${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}"
      VAPID_SUBJECT: "${VAPID_SUBJECT:-mailto:you@example.com}"
      CRON_SECRET: "${CRON_SECRET:-}"
      ALLOW_SIGNUPS: "${ALLOW_SIGNUPS:-false}"
      # The container runs its own scheduler, so no external cron is needed.
      RUN_WORKER: "true"
    volumes:
      - todo-data:/app/data

volumes:
  todo-data:
